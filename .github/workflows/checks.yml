name: checks
on: [push, pull_request]
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Governance config is complete (every CDE has an owner, a definition and a rule)
        run: PYTHONPATH=src python -m dgkit check-config
      - name: Unit tests (rules, scorecards, adoption, privacy, note checker)
        run: python -m unittest discover -s tests -v
      - name: End-to-end run on synthetic snapshots
        run: |
          PYTHONPATH=src python -m dgkit generate --out data
          PYTHONPATH=src python -m dgkit score --data data --out reports/latest
      - name: Example output is reproducible
        run: diff <(python -c "import json;d=json.load(open('reports/latest/facts.json'));d.pop('meta');print(json.dumps(d,sort_keys=True))") <(python -c "import json;d=json.load(open('reports/example/facts.json'));d.pop('meta');print(json.dumps(d,sort_keys=True))")
      - name: Reports never contain personal values
        run: "! grep -rE '@example\\.com|guest-at' reports/"
      - name: Note eval (example note uses only figures and IDs from facts.json)
        run: python evals/check_note.py reports/example/facts.json reports/example/note_bookings.md
      - name: Skill limits
        run: python tools/check_limits.py --platform claude-skill agent/owner-nudge
      - name: Scrub for internal material
        run: python tools/scrub_check.py .
